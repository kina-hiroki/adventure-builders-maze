<div id="ab-maze-3d">
  <div class="viz-row maze-heading">
    <h3>迷路の全体図</h3>
    <span class="text-small text-muted">通路配置：仮案</span>
  </div>
  <svg class="maze-view" role="img" aria-labelledby="ab-maze-title ab-maze-desc">
    <title id="ab-maze-title">縦7m、横7m、壁の高さ1.5mの迷路</title>
    <desc id="ab-maze-desc">入口と出口のある迷路の立体図。縦・横の外寸はそれぞれ7メートル、床から壁の上端までは1.5メートル。通路配置は仮案です。下の回転・視点・拡大率を変更できます。拡大中はドラッグで表示位置を移動できます。</desc>
    <g class="maze-camera">
      <g class="maze-geometry"></g>
      <g class="maze-dimensions"></g>
    </g>
  </svg>
  <div class="maze-settings">
    <div class="viz-row">
      <label class="form-check form-switch">
        <input class="form-check-input" id="ab-maze-solution" type="checkbox">
        <span class="form-check-label">正解ルートを表示</span>
      </label>
      <span class="text-small text-muted" id="ab-maze-route-legend" hidden>実線：通路上 ／ 点線：壁の奥</span>
    </div>
    <div class="viz-controls">
      <label class="form-label" for="ab-maze-view">視点
        <select class="form-select" id="ab-maze-view">
          <option value="oblique">斜めから</option>
          <option value="top">真上から</option>
          <option value="side">真横から（自由回転）</option>
          <option value="front">正面から</option>
          <option value="right">右側から</option>
          <option value="back">背面から</option>
          <option value="left">左側から</option>
        </select>
      </label>
    </div>
    <div class="viz-controls">
      <label class="form-label" for="ab-maze-angle">回転 <output class="tabular-nums" id="ab-maze-angle-value">45°</output>
        <input class="form-range" id="ab-maze-angle" type="range" min="0" max="359" value="45" step="1">
      </label>
    </div>
    <div class="viz-controls">
      <label class="form-label" for="ab-maze-zoom">拡大率 <output class="tabular-nums" id="ab-maze-zoom-value">100%</output>
        <input class="form-range" id="ab-maze-zoom" type="range" min="100" max="300" value="100" step="10">
      </label>
    </div>
    <div class="viz-row">
      <label class="form-check form-switch">
        <input class="form-check-input" id="ab-maze-transparent" type="checkbox">
        <span class="form-check-label">壁を透かす</span>
      </label>
    </div>
    <div class="viz-row">
      <label class="form-check form-switch">
        <input class="form-check-input" id="ab-maze-wall-grid" type="checkbox">
        <span class="form-check-label">壁に1m間隔の点線を表示</span>
      </label>
    </div>
    <div class="viz-row">
      <button class="btn" id="ab-maze-fit" type="button" aria-describedby="ab-maze-navigation-help">全体表示</button>
      <span class="text-small text-muted" id="ab-maze-drag-mode">ドラッグ：回転</span>
    </div>
  </div>
  <div class="sr-only" id="ab-maze-navigation-help">拡大中はドラッグで移動できます。キーボードでは全体表示ボタンにフォーカスし、矢印キーで表示位置を移動できます。</div>
  <div class="sr-only" id="ab-maze-status" aria-live="polite"></div>
</div>
<style>
  #ab-maze-3d { width:100%; color:var(--foreground); }
  #ab-maze-3d .maze-settings { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
  #ab-maze-3d .maze-heading { justify-content:flex-start; gap:16px; padding-right:90px; }
  #ab-maze-3d .maze-heading h3 { margin:0; }
  #ab-maze-3d .maze-view { display:block; width:100%; overflow:hidden; touch-action:pan-y; cursor:grab; }
  #ab-maze-3d .maze-view.is-zoomed { touch-action:none; }
  #ab-maze-3d .maze-view.is-dragging { cursor:grabbing; }
  #ab-maze-3d .maze-geometry polygon { stroke:var(--border); stroke-width:.6; stroke-linejoin:round; }
  #ab-maze-3d .maze-floor { fill:color-mix(in srgb,var(--background) 97%,var(--foreground)); }
  #ab-maze-3d .maze-slab { fill:color-mix(in srgb,var(--muted) 82%,var(--foreground)); }
  #ab-maze-3d .maze-wall-top { fill:color-mix(in srgb,var(--background) 79%,var(--foreground)); }
  #ab-maze-3d .maze-wall-x { fill:color-mix(in srgb,var(--background) 60%,var(--foreground)); }
  #ab-maze-3d .maze-wall-y { fill:color-mix(in srgb,var(--background) 45%,var(--foreground)); }
  #ab-maze-3d.is-transparent :is(.maze-wall-top,.maze-wall-x,.maze-wall-y) { fill-opacity:.18; stroke:var(--muted-foreground); stroke-opacity:.55; }
  #ab-maze-3d .maze-wall-mark { fill:none; stroke:var(--foreground); stroke-width:1; stroke-dasharray:2 4; stroke-linecap:round; opacity:.7; }
  #ab-maze-3d.is-transparent .maze-wall-mark { opacity:.4; }
  #ab-maze-3d .maze-grid { stroke:var(--border); stroke-width:.6; fill:none; opacity:.6; }
  #ab-maze-3d .maze-opening { fill:var(--viz-series-1); stroke:none !important; opacity:.35; }
  #ab-maze-3d .maze-route-floor,
  #ab-maze-3d .maze-route-hidden { fill:none; stroke:var(--viz-series-1); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  #ab-maze-3d .maze-route-hidden { stroke-width:2.5; stroke-dasharray:5 5; }
  #ab-maze-3d .maze-dimension-line { stroke:var(--foreground); stroke-width:1; fill:none; }
  #ab-maze-3d .maze-extension { stroke:var(--muted-foreground); stroke-width:.7; fill:none; }
  #ab-maze-3d .maze-arrow { fill:var(--foreground); }
  #ab-maze-3d .maze-label { fill:var(--foreground); font-family:inherit; paint-order:stroke; stroke:var(--background); stroke-width:5; stroke-linejoin:round; }
  #ab-maze-3d .maze-measure { font-weight:500; }
</style>
<script>
(() => {
  const root = document.getElementById('ab-maze-3d');
  const svg = root.querySelector('.maze-view');
  const geometry = root.querySelector('.maze-geometry');
  const dimensions = root.querySelector('.maze-dimensions');
  const cameraGroup = root.querySelector('.maze-camera');
  const angleInput = root.querySelector('#ab-maze-angle');
  const angleValue = root.querySelector('#ab-maze-angle-value');
  const viewInput = root.querySelector('#ab-maze-view');
  const zoomInput = root.querySelector('#ab-maze-zoom');
  const zoomValue = root.querySelector('#ab-maze-zoom-value');
  const fitButton = root.querySelector('#ab-maze-fit');
  const dragMode = root.querySelector('#ab-maze-drag-mode');
  const solutionInput = root.querySelector('#ab-maze-solution');
  const routeLegend = root.querySelector('#ab-maze-route-legend');
  const transparentInput = root.querySelector('#ab-maze-transparent');
  const wallGridInput = root.querySelector('#ab-maze-wall-grid');
  const status = root.querySelector('#ab-maze-status');
  const NS = 'http://www.w3.org/2000/svg';
  const SIZE = 7, HEIGHT = 1.5, THICKNESS = 0.08, COUNT = 7;
  const views = {
    oblique:{elevation:55}, top:{elevation:90}, side:{elevation:0},
    front:{elevation:0,angle:0}, right:{elevation:0,angle:90},
    back:{elevation:0,angle:180}, left:{elevation:0,angle:270}
  };
  const state = { angle:45, view:'oblique', zoom:1, panX:0, panY:0, showSolution:false,transparentWalls:false,showWallGrid:false };
  let changedAt=0;
  const cells = Array.from({length:COUNT*COUNT}, () => ({seen:false, walls:[true,true,true,true]}));
  const steps = [[0,-1],[1,0],[0,1],[-1,0]];
  let seed = 20261026;
  function random() { seed = (Math.imul(seed,1664525)+1013904223) >>> 0; return seed / 4294967296; }
  const stack = [[0,6]];
  cells[42].seen = true;
  while (stack.length) {
    const [x,y] = stack[stack.length-1];
    const candidates = steps.map(([dx,dy],d) => ({x:x+dx,y:y+dy,d})).filter(n => n.x>=0 && n.x<COUNT && n.y>=0 && n.y<COUNT && !cells[n.y*COUNT+n.x].seen);
    if (!candidates.length) { stack.pop(); continue; }
    const next = candidates[Math.floor(random()*candidates.length)];
    cells[y*COUNT+x].walls[next.d] = false;
    cells[next.y*COUNT+next.x].walls[(next.d+2)%4] = false;
    cells[next.y*COUNT+next.x].seen = true;
    stack.push([next.x,next.y]);
  }
  cells[42].walls[2] = false;
  cells[6].walls[0] = false;

  // Find the shortest traversable route using the same openings as the wall model.
  const startCell=42,goalCell=6;
  const routeParents=Array(COUNT*COUNT).fill(-1);
  routeParents[startCell]=startCell;
  const routeQueue=[startCell];
  for (let q=0;q<routeQueue.length && routeParents[goalCell]===-1;q++) {
    const index=routeQueue[q],x=index%COUNT,y=Math.floor(index/COUNT);
    steps.forEach(([dx,dy],direction)=>{
      const nx=x+dx,ny=y+dy;
      if (cells[index].walls[direction] || nx<0 || nx>=COUNT || ny<0 || ny>=COUNT) return;
      const next=ny*COUNT+nx;
      if (routeParents[next]!==-1) return;
      routeParents[next]=index;routeQueue.push(next);
    });
  }
  const solutionCells=[];
  for (let index=goalCell;;index=routeParents[index]) {
    solutionCells.push(index);
    if (index===startCell) break;
    if (routeParents[index]===-1) throw new Error('入口から出口への通路がありません。');
  }
  solutionCells.reverse();
  const solutionPath=[
    [.5,7.22,.015],
    ...solutionCells.map(index=>[index%COUNT+.5,Math.floor(index/COUNT)+.5,.015]),
    [6.5,-.22,.015]
  ];

  // All wall solids lie inside the exact 7 m by 7 m outside footprint.
  const boxes = [];
  const half = THICKNESS/2;
  function horizontal(x0,x1,y) {
    boxes.push([Math.max(0,x0-half),Math.max(0,y-half),0,Math.min(SIZE,x1+half),Math.min(SIZE,y+half),HEIGHT]);
  }
  function vertical(x,y0,y1) {
    boxes.push([Math.max(0,x-half),Math.max(0,y0-half),0,Math.min(SIZE,x+half),Math.min(SIZE,y1+half),HEIGHT]);
  }
  // Boundary walls extend inward by the illustrative wall thickness.
  boxes.push([0,0,0,6,THICKNESS,HEIGHT]);
  boxes.push([1,SIZE-THICKNESS,0,SIZE,SIZE,HEIGHT]);
  boxes.push([0,0,0,THICKNESS,SIZE,HEIGHT]);
  boxes.push([SIZE-THICKNESS,0,0,SIZE,SIZE,HEIGHT]);
  for (let y=0;y<COUNT;y++) for (let x=0;x<COUNT;x++) {
    const cell = cells[y*COUNT+x];
    if (x<COUNT-1 && cell.walls[1]) vertical(x+1,y,y+1);
    if (y<COUNT-1 && cell.walls[2]) horizontal(x,x+1,y+1);
  }
  // Vertical markings are spaced in model meters, before projection or zoom.
  function wallGridSegments(box,normal) {
    const [x0,y0,z0,x1,y1,z1]=box,segments=[],epsilon=1e-7;
    if (normal[2]!==0) return segments;
    const alongY=normal[0]!==0;
    const low=alongY?y0:x0,high=alongY?y1:x1;
    const fixed=alongY?(normal[0]>0?x1:x0):(normal[1]>0?y1:y0);
    const point=(position,height)=>alongY?[fixed,position,height]:[position,fixed,height];
    if (high-low>=.5) {
      for(let value=Math.ceil(low+epsilon);value<high-epsilon;value++) {
        segments.push([point(value,z0),point(value,z1)]);
      }
    }
    return segments;
  }
  function make(tag, attrs={}, content) {
    const node = document.createElementNS(NS,tag);
    for (const [key,value] of Object.entries(attrs)) node.setAttribute(key,String(value));
    if (content !== undefined) node.textContent = content;
    return node;
  }
  function restore(snapshot) {
    const saved = snapshot?.privateContent;
    if (!saved || saved.version!==1) return;
    if ((saved.changedAt||0)<changedAt) return;
    changedAt=saved.changedAt||0;
    if (Number.isFinite(saved.angle)) state.angle = Math.max(0,Math.min(359,saved.angle));
    if (Object.hasOwn(views,saved.view)) state.view = saved.view;
    if (views[state.view].angle!==undefined) state.angle=views[state.view].angle;
    if (Number.isFinite(saved.zoom)) state.zoom=Math.max(1,Math.min(3,saved.zoom));
    if (Number.isFinite(saved.panX)) state.panX=saved.panX;
    if (Number.isFinite(saved.panY)) state.panY=saved.panY;
    if (typeof saved.showSolution==='boolean') state.showSolution=saved.showSolution;
    if (typeof saved.transparentWalls==='boolean') state.transparentWalls=saved.transparentWalls;
    if (typeof saved.showWallGrid==='boolean') state.showWallGrid=saved.showWallGrid;
    constrainPan();
  }
  restore(window.openai?.widgetState);
  function persist() {
    changedAt=Math.max(Date.now(),changedAt+1);
    const saved = { version:1, changedAt, angle:state.angle, view:state.view,zoom:state.zoom,panX:state.panX,panY:state.panY,showSolution:state.showSolution,transparentWalls:state.transparentWalls,showWallGrid:state.showWallGrid };
    if (window.openai?.setWidgetState) window.openai.setWidgetState({
      modelContent:{ widthM:SIZE,depthM:SIZE,wallHeightM:HEIGHT,layout:'通路配置は仮案',view:state.view,rotationDegrees:state.angle,elevationDegrees:views[state.view].elevation,zoomPercent:Math.round(state.zoom*100),solutionVisible:state.showSolution,wallsTransparent:state.transparentWalls,wallGridVisible:state.showWallGrid,wallGridSpacingM:1,wallGridDirection:'vertical' },
      privateContent:saved
    }).catch(() => {});
  }
  function constrainPan() {
    const limit=(state.zoom-1)/2;
    state.panX=Math.max(-limit,Math.min(limit,state.panX));
    state.panY=Math.max(-limit,Math.min(limit,state.panY));
  }
  function updateCamera() {
    const {width,height}=svg.viewBox.baseVal;
    cameraGroup.setAttribute('transform',`translate(${width/2+state.panX*width} ${height/2+state.panY*height}) scale(${state.zoom}) translate(${-width/2} ${-height/2})`);
    zoomInput.value=String(Math.round(state.zoom*100));
    zoomValue.textContent=`${Math.round(state.zoom*100)}%`;
    dragMode.textContent=state.zoom>1?'ドラッグ：移動':'ドラッグ：回転';
    fitButton.disabled=state.zoom===1;
    svg.classList.toggle('is-zoomed',state.zoom>1);
  }
  function draw() {
    const width = Math.max(280,root.getBoundingClientRect().width);
    const sideView=views[state.view].elevation===0;
    const height = sideView ? Math.max(250,Math.min(340,width*.48)) : Math.max(330,Math.min(580,width*.79));
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    svg.style.height = `${height}px`;
    angleInput.value = String(state.angle);
    angleValue.textContent = `${Math.round(state.angle)}°`;
    viewInput.value = state.view;
    solutionInput.checked=state.showSolution;
    transparentInput.checked=state.transparentWalls;
    wallGridInput.checked=state.showWallGrid;
    root.classList.toggle('is-transparent',state.transparentWalls);
    routeLegend.hidden=!state.showSolution || state.view==='top';
    const theta = state.angle*Math.PI/180;
    const elevation = views[state.view].elevation*Math.PI/180;
    const c=Math.cos(theta),s=Math.sin(theta),se=Math.sin(elevation),ce=Math.cos(elevation);
    function raw([x,y,z]) { return [c*(x-3.5)-s*(y-3.5),se*(s*(x-3.5)+c*(y-3.5))-ce*z]; }
    function depth([x,y,z]) { return ce*(s*x+c*y)+se*z; }
    const bounds=[];
    for (const x of [-.7,7.7]) for (const y of [-.7,7.7]) for (const z of [0,HEIGHT]) bounds.push(raw([x,y,z]));
    const minX=Math.min(...bounds.map(p=>p[0])),maxX=Math.max(...bounds.map(p=>p[0]));
    const minY=Math.min(...bounds.map(p=>p[1])),maxY=Math.max(...bounds.map(p=>p[1]));
    const padX=width<450 ? 48 : 62, padY=42;
    const scale=Math.min((width-2*padX)/(maxX-minX),(height-2*padY)/(maxY-minY));
    const ox=width/2-scale*(minX+maxX)/2,oy=height/2-scale*(minY+maxY)/2;
    function project(p) { const [x,y]=raw(p); return [ox+x*scale,oy+y*scale]; }
    function points(vertices) { return vertices.map(p=>project(p).map(n=>n.toFixed(2)).join(',')).join(' '); }
    const scene=document.createDocumentFragment();
    const floorCorners=[[0,0,0],[7,0,0],[7,7,0],[0,7,0]];
    const allFaces=[];
    const camera=[ce*s,ce*c,se];
    function addBox(box,slab=false) {
      const [a,b,l,d,e,h]=box;
      const v=[[a,b,l],[d,b,l],[d,e,l],[a,e,l],[a,b,h],[d,b,h],[d,e,h],[a,e,h]];
      const specs=[[[4,5,6,7],[0,0,1],'top'],[[0,1,5,4],[0,-1,0],'y'],[[1,2,6,5],[1,0,0],'x'],[[2,3,7,6],[0,1,0],'y'],[[3,0,4,7],[-1,0,0],'x']];
      for (const [ids,n,kind] of specs) {
        if (n[0]*camera[0]+n[1]*camera[1]+n[2]*camera[2]<1e-8) continue;
        const vertices=ids.map(i=>v[i]);
        allFaces.push({vertices,depth:vertices.reduce((t,p)=>t+depth(p),0)/4,cls:slab ? 'maze-slab' : `maze-wall-${kind}`,marks:!slab&&state.showWallGrid?wallGridSegments(box,n):[]});
      }
    }
    addBox([0,0,-.12,7,7,-.005],true);
    allFaces.sort((a,b)=>a.depth-b.depth).forEach(f=>scene.append(make('polygon',{points:points(f.vertices),class:f.cls})));
    scene.append(make('polygon',{points:points(floorCorners),class:'maze-floor'}));
    for (let k=1;k<7;k++) {
      for (const pair of [[[k,0,.002],[k,7,.002]],[[0,k,.002],[7,k,.002]]]) {
        scene.append(make('polyline',{points:points(pair),class:'maze-grid'}));
      }
    }
    scene.append(make('polygon',{points:points([[.18,6.74,.004],[.82,6.74,.004],[.82,7.16,.004],[.18,7.16,.004]]),class:'maze-opening'}));
    scene.append(make('polygon',{points:points([[6.18,-.16,.004],[6.82,-.16,.004],[6.82,.26,.004],[6.18,.26,.004]]),class:'maze-opening'}));
    if (state.showSolution) scene.append(make('polyline',{
      points:points(solutionPath),class:'maze-route-floor','aria-label':'入口から出口までの正解ルート'
    }));
    allFaces.length=0;
    boxes.forEach(b=>addBox(b));
    allFaces.sort((a,b)=>a.depth-b.depth).forEach(f=>{
      scene.append(make('polygon',{points:points(f.vertices),class:f.cls}));
      f.marks.forEach(segment=>scene.append(make('polyline',{points:points(segment),class:'maze-wall-mark','aria-hidden':'true'})));
    });
    // Dashed portions remain traceable when a wall hides the floor-level route.
    if (state.showSolution && state.view!=='top') scene.append(make('polyline',{
      points:points(solutionPath),class:'maze-route-hidden','aria-hidden':'true'
    }));
    geometry.replaceChildren(scene);

    const overlay=document.createDocumentFragment();
    function line(a,b,cls='maze-dimension-line') {
      overlay.append(make('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls}));
    }
    function label(p,text,anchor='middle',measure=false) {
      overlay.append(make('text',{x:p[0],y:p[1],'text-anchor':anchor,'dominant-baseline':'middle',class:`maze-label${measure?' maze-measure':''}`},text));
    }
    function arrow(tip,end) {
      const dx=end[0]-tip[0],dy=end[1]-tip[1],len=Math.hypot(dx,dy);
      if (len<1) return;
      const u=[dx/len,dy/len],v=[-u[1],u[0]],a=5,b=2;
      overlay.append(make('polygon',{points:`${tip[0]},${tip[1]} ${tip[0]+u[0]*a+v[0]*b},${tip[1]+u[1]*a+v[1]*b} ${tip[0]+u[0]*a-v[0]*b},${tip[1]+u[1]*a-v[1]*b}`,class:'maze-arrow'}));
    }
    function dimension(a,b,offsetA,offsetB,text) {
      const pa=project(a),pb=project(b),qa=project(offsetA),qb=project(offsetB);
      line(pa,qa,'maze-extension'); line(pb,qb,'maze-extension');
      line(qa,qb); arrow(qa,qb); arrow(qb,qa);
      const dx=qb[0]-qa[0],dy=qb[1]-qa[1],len=Math.hypot(dx,dy);
      let nx=-dy/len,ny=dx/len;
      const mid=[(qa[0]+qb[0])/2,(qa[1]+qb[1])/2];
      if (nx*(mid[0]-width/2)+ny*(mid[1]-height/2)<0) { nx=-nx; ny=-ny; }
      label([mid[0]+nx*14,mid[1]+ny*14],text,'middle',true);
    }
    // Put horizontal dimensions on the two currently front-facing outside edges.
    const frontY=c>=0 ? 7:0,frontX=s>=0 ? 7:0;
    const offsetY=frontY+(c>=0 ? .5:-.5),offsetX=frontX+(s>=0 ? .5:-.5);
    if (sideView) {
      // A side elevation cannot show an edge directed into the screen as a length.
      // Label that depth explicitly rather than drawing a zero-length dimension.
      const sideMeasures=[
        {a:[0,frontY,0],b:[7,frontY,0],label:'横 7 m',depth:'奥行き（横）7 m'},
        {a:[frontX,0,0],b:[frontX,7,0],label:'縦 7 m',depth:'奥行き（縦）7 m'}
      ];
      let row=0;
      sideMeasures.forEach(measure=>{
        const pa=project(measure.a),pb=project(measure.b);
        if (Math.hypot(pb[0]-pa[0],pb[1]-pa[1])<1) {
          label([width/2,22],measure.depth,'middle',true);
          return;
        }
        const offset=30+row++*30;
        const qa=[pa[0],pa[1]+offset],qb=[pb[0],pb[1]+offset];
        line(pa,qa,'maze-extension');line(pb,qb,'maze-extension');
        line(qa,qb);arrow(qa,qb);arrow(qb,qa);
        label([(qa[0]+qb[0])/2,qa[1]+15],measure.label,'middle',true);
      });
    } else {
      dimension([0,frontY,0],[7,frontY,0],[0,offsetY,0],[7,offsetY,0],'横 7 m');
      dimension([frontX,0,0],[frontX,7,0],[offsetX,0,0],[offsetX,7,0],'縦 7 m');
    }
    if (state.view!=='top') {
      // The rightmost corner always remains on the footprint silhouette.
      const corner=[c>=0?7:0,s>=0?0:7,0];
      const bottom=project(corner),top=project([corner[0],corner[1],HEIGHT]);
      const offset=18;
      const a=[bottom[0]+offset,bottom[1]],b=[top[0]+offset,top[1]];
      line(bottom,[a[0]+4,a[1]],'maze-extension'); line(top,[b[0]+4,b[1]],'maze-extension');
      line(a,b); arrow(a,b); arrow(b,a);
      const multiline=width<450;
      label([a[0]+9,(a[1]+b[1])/2-(multiline?9:0)],multiline?'高さ':'壁の高さ','start',true);
      label([a[0]+9,(a[1]+b[1])/2+(multiline?10:19)],'1.5 m','start',true);
    } else {
      label([width/2,20],'壁の高さ 1.5 m','middle',true);
    }
    const entry=project([.5,7.28,0]),exit=project([6.5,-.28,0]);
    const center=project([3.5,3.5,0]);
    for (const [p,text] of [[entry,'入口'],[exit,'出口']]) {
      const dx=p[0]-center[0],dy=p[1]-center[1],len=Math.hypot(dx,dy);
      if (sideView) label([p[0],p[1]+12],text);
      else label([p[0]+dx/len*13,p[1]+dy/len*13-(text==='出口'?20:0)],text);
    }
    dimensions.replaceChildren(overlay);
    // Preserve readable annotation sizes at narrow widths and every rotation.
    const placed=[];
    dimensions.querySelectorAll('text').forEach(node=>{
      let box=node.getBBox();
      if (box.x<6) node.setAttribute('x',Number(node.getAttribute('x'))+6-box.x);
      if (box.x+box.width>width-6) node.setAttribute('x',Number(node.getAttribute('x'))+width-6-box.x-box.width);
      box=node.getBBox();
      if (node.textContent==='入口' || node.textContent==='出口') {
        let tries=0;
        while (placed.some(other=>box.x<other.x+other.width+5 && box.x+box.width+5>other.x && box.y<other.y+other.height+5 && box.y+box.height+5>other.y) && tries++<5) {
          node.setAttribute('y',Number(node.getAttribute('y'))-19);
          box=node.getBBox();
        }
      }
      if (box.y<6) node.setAttribute('y',Number(node.getAttribute('y'))+6-box.y);
      if (box.y+box.height>height-6) node.setAttribute('y',Number(node.getAttribute('y'))+height-6-box.y-box.height);
      placed.push(box);
    });
    updateCamera();
  }
  function rotate(angle) {
    state.angle=angle;
    if (views[state.view].angle!==undefined) state.view='side';
    draw();
  }
  angleInput.addEventListener('input',()=>rotate(Number(angleInput.value)));
  angleInput.addEventListener('change',()=>{persist();status.textContent=`回転 ${state.angle}度`;});
  viewInput.addEventListener('change',()=>{
    state.view=viewInput.value;
    if (views[state.view].angle!==undefined) state.angle=views[state.view].angle;
    draw();persist();status.textContent=`視点：${viewInput.selectedOptions[0].textContent}`;
  });
  solutionInput.addEventListener('change',()=>{
    state.showSolution=solutionInput.checked;draw();persist();
    status.textContent=state.showSolution?'正解ルートを表示しました。':'正解ルートを非表示にしました。';
  });
  transparentInput.addEventListener('change',()=>{
    state.transparentWalls=transparentInput.checked;draw();persist();
    status.textContent=state.transparentWalls?'壁を半透明にしました。':'壁を通常表示に戻しました。';
  });
  wallGridInput.addEventListener('change',()=>{
    state.showWallGrid=wallGridInput.checked;draw();persist();
    status.textContent=state.showWallGrid?'壁に1メートル間隔の縦の点線を表示しました。':'壁の点線を非表示にしました。';
  });
  zoomInput.addEventListener('input',()=>{
    const nextZoom=Number(zoomInput.value)/100;
    const ratio=nextZoom/state.zoom;
    state.panX*=ratio;state.panY*=ratio;state.zoom=nextZoom;
    constrainPan();updateCamera();
  });
  zoomInput.addEventListener('change',()=>{persist();status.textContent=`拡大率 ${Math.round(state.zoom*100)}パーセント。拡大中はドラッグで移動できます。`;});
  fitButton.addEventListener('click',()=>{
    state.zoom=1;state.panX=0;state.panY=0;updateCamera();persist();
    status.textContent='全体表示に戻しました。';
  });
  fitButton.addEventListener('keydown',event=>{
    const directions={ArrowLeft:[-.08,0],ArrowRight:[.08,0],ArrowUp:[0,-.08],ArrowDown:[0,.08]};
    if (state.zoom<=1 || !Object.hasOwn(directions,event.key)) return;
    event.preventDefault();
    state.panX+=directions[event.key][0];state.panY+=directions[event.key][1];
    constrainPan();updateCamera();persist();status.textContent='表示位置を移動しました。';
  });
  let drag=null;
  svg.addEventListener('pointerdown',event=>{
    if (event.button!==0) return;
    const rect=svg.getBoundingClientRect();
    drag={x:event.clientX,y:event.clientY,angle:state.angle,panX:state.panX,panY:state.panY,width:rect.width,height:rect.height,move:state.zoom>1};
    svg.setPointerCapture(event.pointerId);
    svg.classList.add('is-dragging');
  });
  svg.addEventListener('pointermove',event=>{
    if (!drag) return;
    if (drag.move) {
      state.panX=drag.panX+(event.clientX-drag.x)/drag.width;
      state.panY=drag.panY+(event.clientY-drag.y)/drag.height;
      constrainPan();updateCamera();
    } else rotate(Math.round(((drag.angle+(event.clientX-drag.x)*.45)%360+360)%360));
  });
  function endDrag() { if (!drag) return; drag=null;svg.classList.remove('is-dragging');persist(); }
  svg.addEventListener('pointerup',endDrag);
  svg.addEventListener('pointercancel',endDrag);
  svg.addEventListener('lostpointercapture',endDrag);
  window.addEventListener('openai:set_globals',event=>{
    if (event.detail?.globals?.widgetState) {restore(event.detail.globals.widgetState);draw();}
  });
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
